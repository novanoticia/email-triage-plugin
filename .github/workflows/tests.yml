name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # Desde requirements.txt, no 'pip install pyyaml' suelto: si el pin y lo
      # que instala el CI pueden divergir, el pin no prueba nada.
      - name: Dependencias (PyYAML — lo usan los tests de _cargar_config)
        run: pip install --quiet -r requirements.txt

      # Los tests viven en tests/, FUERA de la skill: skills/<n>/scripts/ se
      # empaqueta entero al exportar a Agent Skills y 217 KB de tests viajaban
      # dentro de cada .zip. `-t .` hace que `tests` se importe como paquete,
      # y su __init__ pone scripts/ en sys.path antes que ningun test.
      - name: Tests de triage_helpers (S0-S5 y PASO 0.B)
        run: python3 -m unittest discover -s tests -t . -v

      - name: config.yaml parsea sin trampas YAML 1.1
        run: |
          python3 - <<'EOF'
          import yaml
          cfg = yaml.safe_load(open(
              'plugins/email-triage/skills/email-triage/config.yaml',
              encoding='utf-8'))
          crits = cfg['criterios_epistemicos']
          # 'no:'/'si:' sin comillas se convierten en booleanos en YAML 1.1
          # (regresión del fix de v3.4.1) — las claves deben ser strings.
          bools = [k for k, v in crits.items()
                   if False in v or True in v]
          assert not bools, (
              f"claves booleanas en criterios (¿'no:' sin comillas?): {bools}")
          assert len(crits) == 30, f"se esperaban 30 criterios, hay {len(crits)}"
          print(f"OK: {len(crits)} criterios, 0 claves booleanas")
          EOF

      - name: Coherencia de versiones (plugin.json ↔ marketplace.json ↔ SKILL.md ↔ config)
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          r = pathlib.Path('.')
          def jver(p): return json.loads((r/p).read_text(encoding='utf-8'))['version']
          pj   = jver('.claude-plugin/plugin.json')
          inn  = jver('plugins/email-triage/.claude-plugin/plugin.json')
          port = jver('plugins/email-triage/plugin.json')
          mk   = re.search(r'"version"\s*:\s*"([^"]+)"',
                           (r/'.claude-plugin/marketplace.json').read_text(encoding='utf-8')).group(1)
          skill_txt = (r/'plugins/email-triage/skills/email-triage/SKILL.md'
                       ).read_text(encoding='utf-8')
          # `version` no es clave permitida en el frontmatter de Agent Skills:
          # vive bajo `metadata:`. Se acota el bloque antes de buscarla para no
          # casar con un `version:` cualquiera del cuerpo.
          fm = re.match(r'\A---\r?\n(.*?)\r?\n---', skill_txt, re.S)
          assert fm, "SKILL.md sin frontmatter YAML al inicio"
          sk   = re.search(r'(?m)^\s+version:\s*"?([0-9.]+)"?', fm.group(1)).group(1)
          rd   = re.search(r'(?m)^#\s+Email Triage Plugin v([0-9.]+)',
                           (r/'README.md').read_text(encoding='utf-8')).group(1)
          th   = re.search(r'email-triage \(v([0-9.]+)\)',
                           (r/'plugins/email-triage/skills/email-triage/scripts/triage_helpers.py'
                            ).read_text(encoding='utf-8')).group(1)
          vers = {'plugin.json(root)': pj, 'plugin.json(inner)': inn,
                  'plugin.json(portable)': port,
                  'marketplace.json': mk, 'SKILL.md metadata': sk, 'README.md': rd,
                  'triage_helpers.py': th}
          assert len(set(vers.values())) == 1, f"versiones divergentes: {vers}"
          mm = '.'.join(pj.split('.')[:2])
          cfg = (r/'plugins/email-triage/skills/email-triage/config.yaml').read_text(encoding='utf-8')
          m = re.search(r'EMAIL TRIAGE v([0-9]+\.[0-9]+)', cfg)
          if m:
              assert m.group(1) == mm, f"config.yaml header v{m.group(1)} != v{mm}"
          # H1 del SKILL.md: derivó en el pasado (quedó en v3.4 en un plugin
          # v3.8). Ahora también es un gate — major.minor debe coincidir (#5).
          h1 = re.search(r'(?m)^#\s+Email Triage v([0-9]+\.[0-9]+)\s+—', skill_txt)
          assert h1, "no se encontró el H1 '# Email Triage vX.Y —' en SKILL.md"
          assert h1.group(1) == mm, f"H1 del SKILL.md v{h1.group(1)} != v{mm}"
          print(f"OK: todo en {pj} (config + H1 SKILL en v{mm})")
          PY

      - name: Unicidad del árbol de scripts y tests fuera del paquete
        run: |
          python3 - <<'PY'
          import pathlib
          r = pathlib.Path('.')
          canon = 'plugins/email-triage/skills/email-triage/scripts'
          skill = 'plugins/email-triage/skills/email-triage'
          # Cada fichero, en su única raíz. test_triage_helpers.py ya NO vive
          # bajo scripts/: la carpeta de la skill se empaqueta entera al
          # exportar a Agent Skills, y los tests no deben viajar dentro.
          esperado = {'triage_helpers.py': canon, 'test_triage_helpers.py': 'tests'}
          bad = []
          for name, raiz in esperado.items():
              hits = [str(p).replace('\\', '/') for p in r.rglob(name)
                      if '.git' not in p.parts]
              if len(hits) != 1:
                  bad.append(f"{name}: {len(hits)} copias -> {hits}")
              elif not hits[0].startswith(raiz + '/'):
                  bad.append(f"{name} fuera de {raiz}/ -> {hits[0]}")
          stray = r / 'plugins/email-triage/scripts'
          if stray.exists():
              bad.append(f"árbol paralelo presente: {stray} (Cowork empaquetaría el viejo)")
          # La invariante que protege el adelgazamiento del paquete: ni un
          # test_*.py dentro de la skill. Si vuelve uno, vuelve a los .zip.
          colados = sorted(str(p).replace('\\', '/')
                           for p in (r / skill).rglob('test_*.py'))
          if colados:
              bad.append("tests dentro de la skill (viajarían en el paquete "
                         f"exportado): {colados}")
          assert not bad, "Árbol de scripts/tests incorrecto:\n  " + "\n  ".join(bad)
          print(f"OK: scripts canónicos en {canon}/, tests en tests/, "
                f"0 tests dentro de la skill")
          PY

      - name: Changelog del README en sincronía con la versión
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          r = pathlib.Path('.')
          v = json.loads((r/'.claude-plugin/plugin.json').read_text(encoding='utf-8'))['version']
          rd = (r/'README.md').read_text(encoding='utf-8')
          # bump-version.sh mecaniza el H1 del README, pero la seccion de
          # novedades se escribe a mano y puede olvidarse (paso en v3.8.11).
          # Este gate convierte el recordatorio en mecanismo.
          assert f'## Novedades en v{v}' in rd, (
              f"README.md sin seccion '## Novedades en v{v}' — el H1 ya esta "
              f"en v{v}; anade la entrada de novedades antes de publicar")
          m = re.search(r'(?m)^## Novedades en v([0-9.]+)', rd)
          assert m and m.group(1) == v, (
              f"la primera seccion de novedades del README es v{m.group(1)}, "
              f"no v{v}: la entrada nueva va por encima de las anteriores")
          print(f"OK: changelog del README al dia (v{v})")
          PY

      - name: Conformidad con Agent Plugins 1.0.0 y Agent Skills
        run: |
          python3 - <<'PY'
          import json, re, pathlib, yaml
          r = pathlib.Path('.')
          P = r / 'plugins/email-triage'          # raíz del plugin (§4)
          SPEC = 'https://agent-plugins.org/schemas/1.0.0'
          errs = []

          # ── §5: manifiesto portable en la RAÍZ del plugin, esquema cerrado ──
          man_path = P / 'plugin.json'
          if not man_path.is_file():
              errs.append(f"falta el manifiesto portable {man_path} (§5.1: un "
                          f"cliente conformante rechaza el plugin sin él)")
              man = {}
          else:
              man = json.loads(man_path.read_text(encoding='utf-8'))
          PERMITIDOS = {'$schema', 'name', 'version', 'description', 'author',
                        'homepage', 'repository', 'license', 'keywords',
                        'extensions'}
          extra = set(man) - PERMITIDOS
          if extra:
              errs.append(f"plugin.json con campos fuera del esquema cerrado "
                          f"(§5.2): {sorted(extra)}")
          if man.get('$schema') != f'{SPEC}/plugin.schema.json':
              errs.append(f"plugin.json: $schema debe ser exactamente "
                          f"{SPEC}/plugin.schema.json (§5.2/§5.3)")
          nombre = man.get('name', '')
          # §5.5: 1-64, [a-z0-9.-], extremos alfanuméricos, sin '--' ni '..'
          if not re.fullmatch(r'(?!.*(?:--|\.\.))[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?',
                              nombre) or len(nombre) > 64:
              errs.append(f"plugin.json: name {nombre!r} viola §5.5")
          autor = man.get('author', {})
          if not isinstance(autor, dict) or set(autor) - {'name', 'email', 'url'}:
              errs.append(f"plugin.json: author debe ser objeto con solo "
                          f"name/email/url (§5.4), es {autor!r}")

          # ── §6.1/§7.1: skills en skills/<nombre>/SKILL.md, sin recursión ──
          sk_dir = P / 'skills'
          if not sk_dir.is_dir():
              errs.append("falta skills/ (§6.1)")
          skills = sorted(d for d in sk_dir.iterdir()
                          if d.is_dir() and (d / 'SKILL.md').is_file()) \
                   if sk_dir.is_dir() else []
          if not skills:
              errs.append("§7.1: ningún skills/<dir>/SKILL.md descubrible")

          # ── Agent Skills: frontmatter de conjunto CERRADO ──
          CLAVES = {'name', 'description', 'license', 'compatibility',
                    'metadata', 'allowed-tools'}
          for d in skills:
              txt = (d / 'SKILL.md').read_text(encoding='utf-8')
              m = re.match(r'\A---\r?\n(.*?)\r?\n---', txt, re.S)
              if not m:
                  errs.append(f"{d.name}: SKILL.md sin frontmatter en el byte 0")
                  continue
              fm = yaml.safe_load(m.group(1)) or {}
              sobra = set(fm) - CLAVES
              if sobra:
                  errs.append(f"{d.name}: claves no permitidas en frontmatter "
                              f"{sorted(sobra)} — un cliente conformante SE SALTA "
                              f"el skill (§7.1). 'version' va en metadata.")
              if fm.get('name') != d.name:
                  errs.append(f"{d.name}: frontmatter name {fm.get('name')!r} "
                              f"!= nombre del directorio")
              desc = (fm.get('description') or '').strip()
              if not 1 <= len(desc) <= 1024:
                  errs.append(f"{d.name}: description mide {len(desc)} chars "
                              f"(el máximo es 1024)")
              comp = (fm.get('compatibility') or '').strip()
              if len(comp) > 500:
                  errs.append(f"{d.name}: compatibility mide {len(comp)} "
                              f"chars (el máximo es 500)")
              meta = fm.get('metadata', {})
              if meta and (not isinstance(meta, dict) or
                           not all(isinstance(k, str) and isinstance(v, str)
                                   for k, v in meta.items())):
                  errs.append(f"{d.name}: metadata debe mapear string->string, "
                              f"es {meta!r}")

          # ── §7.2: mcp.json es OPCIONAL (§6.2) pero si existe, cerrado ──
          mcp = P / 'mcp.json'
          if mcp.is_file():
              cfg = json.loads(mcp.read_text(encoding='utf-8'))
              if set(cfg) != {'$schema', 'mcpServers'}:
                  errs.append(f"mcp.json: solo se permiten $schema y mcpServers "
                              f"(§7.2.1), hay {sorted(cfg)}")
              if cfg.get('$schema') != f'{SPEC}/mcp.schema.json':
                  errs.append(f"mcp.json: $schema debe ser {SPEC}/mcp.schema.json")
              # §10.1: la versión de mcp.json debe casar con la de plugin.json
              if (cfg.get('$schema') or '').rsplit('/', 2)[-2:-1] != \
                 (man.get('$schema') or '').rsplit('/', 2)[-2:-1]:
                  errs.append("mcp.json apunta a otra versión de Agent Plugins "
                              "que plugin.json (§10.1)")

          # ── §4.1: nada del paquete puede resolver fuera de la raíz ──
          for p in P.rglob('*'):
              if p.is_symlink():
                  destino = p.resolve()
                  if not str(destino).startswith(str(P.resolve())):
                      errs.append(f"§4.1: {p} escapa de la raíz -> {destino}")

          assert not errs, "No conforma con Agent Plugins 1.0.0:\n  - " + \
                           "\n  - ".join(errs)
          print(f"OK: plugin {nombre!r} conforma con Agent Plugins 1.0.0 "
                f"({len(skills)} skill(s), mcp.json "
                f"{'presente' if mcp.is_file() else 'ausente (§6.2: válido)'})")
          PY

      - name: Fuzz de totalidad de los puntos de entrada (semilla rotativa)
        run: |
          python3 - <<'PY'
          import sys, json, random, datetime
          sys.path.insert(0, '.')
          # tests/__init__.py pone scripts/ en sys.path al importar el paquete,
          # así que este import tiene que ir ANTES que el de triage_helpers.
          from tests import test_triage_helpers as tt
          import triage_helpers as th
          # Semilla derivada de la fecha: la suite local es reproducible
          # (semilla fija), el CI explora entradas nuevas cada día. La
          # invariante es la misma: total + dict serializable.
          semilla = int(datetime.date.today().strftime("%Y%m%d"))
          rng = random.Random(semilla)
          def total(fn, *a):
              try:
                  r = fn(*a)
              except Exception as e:
                  print("FALLO:", fn.__name__, type(e).__name__, repr(e)[:160])
                  print("  args=", repr(a)[:300]); sys.exit(1)
              assert isinstance(r, dict), (fn.__name__, type(r).__name__)
              json.dumps(r, ensure_ascii=False)
          N = 20000
          for _ in range(N):
              total(th.cmd_scoring_dispatch, tt._rand_json(rng),
                    tt._rand_json(rng), bool(rng.getrandbits(1)))
              total(th.cmd_montar_mover, tt._rand_json(rng))
              total(th.cmd_sanitizar, tt._rand_texto(rng),
                    rng.choice([1500, 800, 0, -3, 1]),
                    tt._rand_texto(rng), tt._rand_texto(rng))
              total(th.cmd_calibrar, tt._rand_json(rng))
              total(th.cmd_verificar_sesion, tt._rand_json(rng))
          print(f"OK: fuzz de totalidad, semilla {semilla}, {N} iters x 5 entradas")
          PY

  # ── Gate F10 (auditoría 2026-08-07) ─────────────────────────────────
  # v3.11.0 se publicó y main siguió avanzando tres PRs con la misma
  # versión declarada. Ningún gate lo vio: el de coherencia solo compara
  # los 7 sitios ENTRE SÍ (los siete decían 3.11.0, y estaban de acuerdo
  # en algo falso), y el de changelog solo comprueba que exista la
  # sección de esa versión. Ninguno comparaba el repo con lo PUBLICADO.
  # Resultado: quien instalara por tag se llevaba el código sin los
  # arreglos, y el marketplace anunciaba una versión que no era esa.
  #
  # Este job falla SOLO en ese estado concreto: la versión declarada ya
  # tiene tag Y el contenido distribuible ha cambiado desde él. Si la
  # versión aún no está publicada, pasa (es el estado normal mientras se
  # trabaja hacia la siguiente release). Se resuelve solo en cuanto se
  # sube versión: la nueva no tiene tag todavía.
  sincronia-con-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # historia completa: hace falta comparar
          fetch-tags: true

      - name: La versión declarada no puede llevar contenido sin publicar
        run: |
          set -euo pipefail
          V=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          TAG="v$V"
          echo "Versión declarada: $V"

          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "✅ $TAG aún no está publicada: estado normal de trabajo"
            echo "   hacia la siguiente release. Nada que comparar."
            exit 0
          fi

          # Solo cuenta lo que se DISTRIBUYE. Un retoque de CI, de
          # ARCHITECTURE.md o de los tests no obliga a publicar nada.
          RUTAS="plugins/ scripts/install-plugin.sh .claude-plugin/"
          if git diff --quiet "$TAG" HEAD -- $RUTAS; then
            echo "✅ $TAG y HEAD coinciden en el contenido distribuible."
            exit 0
          fi

          N=$(git rev-list "$TAG"..HEAD --count -- $RUTAS)
          echo ""
          echo "❌ $TAG ya está publicada y el contenido distribuible ha"
          echo "   cambiado desde entonces ($N commit(s)). Quien instale por"
          echo "   tag NO recibirá estos cambios, y el marketplace anuncia"
          echo "   $V para un código que ya no es ese."
          echo ""
          echo "   Ficheros que difieren respecto a $TAG:"
          git diff --name-only "$TAG" HEAD -- $RUTAS | sed 's/^/     - /'
          echo ""
          echo "   Arréglalo en ESTA rama, no después:"
          echo "     ./scripts/bump-version.sh X.Y.Z"
          echo "     y añade '## Novedades en vX.Y.Z' al README.md"
          echo "   Tras el merge: Actions → release → Run workflow."
          exit 1

  # ── i18n (v3.14) ────────────────────────────────────────────────────
  # Soporte multiidioma (es/en/fr). El check se llama «i18n» (id del job,
  # sin `name:` propio): ese es el nombre exacto que habría que exigir si
  # algún día se activa la protección de rama. Comprueba:
  #   1. los catálogos de i18n/ son válidos (mismas claves, huecos, tiers,
  #      emojis, glosario y estado coherente entre idiomas);
  #   2. es.yaml es EXACTAMENTE lo que se extrae del original (no se edita
  #      a mano: se regenera y no puede haber diferencia);
  #   3. las pruebas i18n (línea base del idioma por defecto, resolver del
  #      idioma, extracción, validador, bloque de SKILL.md, documentación).
  i18n:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias (PyYAML — lo usan el extractor y el validador)
        run: pip install --quiet -r requirements.txt

      - name: Catálogos válidos
        run: python3 scripts/i18n_validar.py

      - name: es.yaml coincide con lo que se extrae del original
        run: |
          python3 scripts/i18n_extraer.py generar
          git diff --exit-code -- plugins/email-triage/skills/email-triage/i18n/es.yaml

      - name: Pruebas i18n (idioma por defecto sin cambios, resolver, bloque, docs)
        run: |
          python3 -m unittest discover -s tests -t . -p "test_i18n*.py" -v
          python3 -m unittest tests.test_idioma -v
