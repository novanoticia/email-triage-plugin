name: Mistral PR Review

on:
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened, edited]

# Un push nuevo cancela la revisión anterior del mismo PR.
concurrency:
  group: mistral-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mistral-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # El diff se calcula con git (base...cabeza): hace falta historia.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # El script vive en .github/scripts/mistral_review.py (solo stdlib).
      # Modelo: variable de repositorio MISTRAL_MODEL (Settings → Secrets and
      # variables → Actions → Variables); sin ella, codestral-latest.
      - name: Mistral AI Review
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/mistral_review.py
