name: Mistral PR Review

on:
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened, edited]

# Un push nuevo cancela la revisión anterior del mismo PR.
concurrency:
  group: mistral-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # El revisor vive en novanoticia/mistral-review; aquí solo se llama.
  mistral-review:
    permissions:
      pull-requests: write
      contents: read
    uses: novanoticia/mistral-review/.github/workflows/review.yml@v1.4
    with:
      # Debe coincidir con la etiqueta de `uses:` (versión fija de mistral-review).
      ref: v1.4
      # Proveedor: MISTRAL_PROVIDER vacío o `mistral` = Mistral con MISTRAL_MODEL;
      # `openrouter` = OpenRouter con OPENROUTER_MODEL (forma organización/modelo; sin ella falla)
      # y el secreto OPENROUTER_API_KEY. Cambiar de proveedor = cambiar solo MISTRAL_PROVIDER.
      model: ${{ vars.MISTRAL_PROVIDER == 'openrouter' && vars.OPENROUTER_MODEL || vars.MISTRAL_PROVIDER != 'openrouter' && vars.MISTRAL_MODEL || '' }}
      provider: ${{ vars.MISTRAL_PROVIDER }}
      openrouter_provider: ${{ vars.OPENROUTER_PROVIDER }}
      # Generados: se regeneran con scripts, no se revisan.
      excluded: |
        tests/i18n/linea_base.json
        plugins/email-triage/skills/email-triage/i18n/es.yaml
      # CLAUDE.md es la guía canónica; AGENTS.md solo la resume para otros agentes.
      guides: |
        REVIEW.md
        CLAUDE.md
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
