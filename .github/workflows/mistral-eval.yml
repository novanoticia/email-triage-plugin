name: Mistral Eval

# Evaluación manual del revisor con casos reales del historial de este repo
# (.github/eval/casos.json; plantilla en mistral-review/ejemplos/eval-casos.json).
# No se lanza sola: cada solicitud cuesta dinero.
on:
  workflow_dispatch:
    inputs:
      repeticiones:
        description: Revisiones por caso
        default: '2'
      solo:
        description: Ids de casos separados por comas (vacío = todos)
        default: ''
      modelo:
        description: Modelo solo para esta evaluación (vacío = MISTRAL_MODEL)
        default: ''
      esfuerzo:
        description: Esfuerzo de razonamiento, low, medium o high (vacío = el del revisor)
        default: ''
      max_salida:
        description: Tope de tokens de salida, 4000 a 256000 (vacío = el del revisor)
        default: ''
      proveedor:
        description: Proveedor del modelo; openrouter exige `modelo` (organización/modelo) y el secreto OPENROUTER_API_KEY
        type: choice
        options:
          - mistral
          - openrouter
        default: mistral
      proveedor_final:
        description: Solo con OpenRouter, proveedor final fijo (p. ej. z-ai); vacío = lo elige OpenRouter
        default: ''

concurrency:
  group: mistral-eval
  cancel-in-progress: false

jobs:
  mistral-eval:
    permissions:
      contents: read
    uses: novanoticia/mistral-review/.github/workflows/eval.yml@v1.2
    with:
      # Debe coincidir con la etiqueta de `uses:` (versión fija de mistral-review).
      ref: v1.2
      repeticiones: ${{ inputs.repeticiones }}
      solo: ${{ inputs.solo }}
      modelo: ${{ inputs.modelo }}
      esfuerzo: ${{ inputs.esfuerzo }}
      max_salida: ${{ inputs.max_salida }}
      model: ${{ vars.MISTRAL_MODEL }}
      # Solo esta evaluación: la revisión de los PR sigue en Mistral.
      provider: ${{ inputs.proveedor }}
      openrouter_provider: ${{ inputs.proveedor_final }}
      excluded: |
        tests/i18n/linea_base.json
        plugins/email-triage/skills/email-triage/i18n/es.yaml
      # CLAUDE.md es la guía canónica; AGENTS.md solo la resume para otros agentes.
      guides: |
        REVIEW.md
        CLAUDE.md
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
