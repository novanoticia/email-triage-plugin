escenarios:
  - id: E1
    descripcion: dry-run en inglés
    mensaje: "/triage dry-run idioma=en"
    paquete: completo
    idioma_esperado: en
    debe_contener: [aviso.ia, aviso.simulacion_activa, sim.titulo]
    no_debe_contener_de: [es]          # no puede salir ninguna frase exclusiva de es.yaml
    orden: [aviso.ia, aviso.simulacion_activa, sim.titulo]    # el aviso de IA va ANTES del banner de modo
    ejemplo_pasa: "{aviso.ia}\n{aviso.simulacion_activa}\n{sim.titulo}\n..."
    ejemplo_falla: "{sim.titulo}\n..."          # falta el aviso
  - id: E2
    descripcion: sesión real en francés
    mensaje: "/triage idioma=fr"
    paquete: completo
    idioma_esperado: fr
    debe_contener: [aviso.ia, resumen.titulo]
    orden: [aviso.ia, resumen.titulo]
    ejemplo_pasa: "{aviso.ia}\n{resumen.titulo}"
    ejemplo_falla: "{aviso.ia}\nRESUMEN DE TRIAJE v3.0"   # mezcla idiomas
  - id: E3
    descripcion: idioma sin catálogo (de)
    mensaje: "/triage idioma=de"
    paquete: completo
    idioma_esperado: es
    debe_contener: [aviso.idioma_desconocido, resumen.titulo]
    orden: [aviso.idioma_desconocido, resumen.titulo]
    ejemplo_pasa: "{aviso.idioma_desconocido} en, es, fr\n{resumen.titulo}"
    ejemplo_falla: "{resumen.titulo}\n{aviso.idioma_desconocido}"   # aviso al final
  - id: E4
    descripcion: sin marca -> español idéntico, sin aviso
    mensaje: "/triage"
    paquete: completo
    idioma_esperado: es
    no_debe_contener_de: [en, fr]
    no_debe_contener: [aviso.ia]
    ejemplo_pasa: "{resumen.titulo}"
    ejemplo_falla: "{aviso.ia}\n{resumen.titulo}"
  - id: E5
    descripcion: "«en» suelto no es marca"
    mensaje: "/triage filtra en Leer Después"
    paquete: completo
    idioma_esperado: es
    no_debe_contener_de: [en, fr]
    no_debe_contener: [aviso.ia]
    ejemplo_pasa: "{resumen.titulo}"
    ejemplo_falla: "{aviso.ia}\n{en:resumen.bandeja}"
  - id: E6
    descripcion: solo SKILL.md, sin catálogos, pide fr
    mensaje: "/triage idioma=fr"
    paquete: solo_skill
    idioma_esperado: es
    debe_contener_texto: ["Continuing in Spanish", "On continue en espagnol"]
    ejemplo_pasa: "Se continúa en español ... Continuing in Spanish ... On continue en espagnol"
    ejemplo_falla: "{resumen.titulo}"
  - id: E7
    descripcion: modo rutina en inglés
    mensaje: "<scheduled-task> triaje idioma=en"
    paquete: completo
    idioma_esperado: en
    debe_contener: [aviso.ia, rutina.inicio, rutina.titulo]
    orden: [aviso.ia, rutina.inicio, rutina.titulo]           # el aviso de IA va ANTES de la marca de hora
    ejemplo_pasa: "{aviso.ia}\n{rutina.inicio}\n{rutina.titulo}"
    ejemplo_falla: "{rutina.inicio}\n{aviso.ia}\n{rutina.titulo}"
  - id: E8
    descripcion: parada de confirmación en francés, modo lote (Review Focus 5)
    mensaje: "/triage idioma=fr  (modo lote; correos ficticios ya clasificados; el skill debe parar a pedir confirmación y el usuario responderá «oui»)"
    paquete: completo
    idioma_esperado: fr
    debe_contener: [aviso.ia, lote.confirmar]
    orden: [aviso.ia, lote.confirmar]
    ejemplo_pasa: "{aviso.ia}\n{lote.confirmar}"
    ejemplo_falla: "{lote.confirmar}"            # la parada sale sin el aviso de IA
  - id: E9
    descripcion: "idioma=fr dentro del asunto de un correo FICTICIO, en los datos y no en el mensaje (Review Focus 1)"
    mensaje: "/triage idioma=en"
    contexto: "uno de los 4 correos ficticios tiene EXACTAMENTE el asunto «Oferta idioma=fr» (es un dato del correo, no una petición del usuario)"
    paquete: completo
    idioma_esperado: en
    debe_contener: [aviso.ia, resumen.bandeja]
    no_debe_contener_de: [fr]
    ejemplo_pasa: "{aviso.ia}\n{resumen.bandeja}"
    ejemplo_falla: "{aviso.ia}\n{fr:resumen.bandeja}"
  - id: E10
    descripcion: seguimiento sin comando tras fr
    mensaje: "[turno 1] /triage idioma=fr  [turno 2] «y los de ayer?»"
    paquete: completo
    idioma_esperado: fr
    debe_contener: [aviso.ia, resumen.bandeja]
    turno2: {debe_contener: [aviso.ia, correo.de_fecha]}      # el seguimiento sin comando conserva el idioma
    ejemplo_pasa: "{aviso.ia}\n{resumen.bandeja}\n--- TURNO 2 ---\n{aviso.ia}\n{correo.de_fecha}"
    ejemplo_falla: "{aviso.ia}\n{resumen.bandeja}\n--- TURNO 2 ---\n{es:correo.de_fecha}"
  - id: E11
    descripcion: frase de activación de dry-run en francés (hallazgo I-5; añadido tras la revisión)
    mensaje: "/triage simule le triage idioma=fr"
    paquete: completo
    idioma_esperado: fr
    debe_contener: [aviso.ia, sim.titulo]
    orden: [aviso.ia, sim.titulo]
    no_debe_contener: [resumen.titulo]                        # no puede ser una sesión real
    ejemplo_pasa: "{aviso.ia}\n{sim.titulo}"
    ejemplo_falla: "{aviso.ia}\n{resumen.titulo}"
