     patron: '^(🔵 Recomendación: MOVER hilo completo \(N mensajes\) → \[destino\] / DEJAR / ARCHIVAR)$'}
  # ── references/paso-1-doctrina-ejecucion.md ──
  - {clave: calibracion.primera, fichero: references/paso-1-doctrina-ejecucion.md, cita: true,
     patron: '(?s)^> (⏳ Primera ejecución: no hay calibración cacheada.*?reutilizarán la caché\.)$'}
  # ── references/paso-6-deshacer.md y manejo-errores.md (resto) ──
  - {clave: deshacer.titulo, fichero: references/paso-6-deshacer.md, patron: '^\s*(Sesiones disponibles para deshacer:)$'}
  - {clave: deshacer.item1, fichero: references/paso-6-deshacer.md,
     patron: '^\s*(1\. 20250407-143022 — 12 correos movidos \(hace 2 horas\))$'}
  - {clave: deshacer.item2, fichero: references/paso-6-deshacer.md,
     patron: '^\s*(2\. 20250406-091500 — 8 correos movidos \(ayer\))$'}
  - {clave: deshacer.item3, fichero: references/paso-6-deshacer.md,
     patron: '^\s*(3\. 20250405-162300 — 23 correos movidos \(hace 2 días\))$'}
  - {clave: deshacer.revertir, fichero: references/paso-6-deshacer.md, riesgo: alto,
