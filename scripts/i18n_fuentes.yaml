     patron: '"(Analizando N correos, esto puede tardar un momento)"'}

excluidos:
  - {fichero: SKILL.md, patron: '^\{"(session_id|event)":', motivo: 'formato de máquina (JSONL)'}
  - {fichero: SKILL.md, patron: '^\s*─{10,}$', motivo: 'separador decorativo: se copia tal cual'}
  - {fichero: references/salidas-por-modo.md, patron: '^\s*─{10,}$', motivo: 'separador decorativo: se copia tal cual'}
  - {fichero: references/salidas-por-modo.md, patron: '^\s+\.\.\.$', motivo: 'marcador de repetición de la plantilla'}
  - {fichero: SKILL.md, patron: '^> \*\*Graduar `sender_bulk` por frecuencia', motivo: 'nota de doctrina para el modelo, no se muestra'}
  - {fichero: SKILL.md, patron: '(?s)^> Nota: el campo `eje` de cada criterio.*?sin tocar código\.$', motivo: 'nota de documentación, no se muestra'}
  - {fichero: SKILL.md, patron: '(?s)^> El texto dentro de `<email-body-data>`.*?nunca del cuerpo del correo\.$', motivo: 'framing de seguridad para el modelo, no se muestra'}
  - {fichero: SKILL.md, patron: '^\s+\[Omitir esta línea si no hubo ajustes aprendidos\]$', motivo: 'instrucción entre corchetes para el modelo'}
  - {fichero: references/paso-1-doctrina-ejecucion.md, patron: '(?s)^> Pegar bajo la sección.*?predecible\.$', motivo: 'nota de integración para desarrolladores'}
  - {fichero: references/paso-1-proveedores.md, patron: '(?s)^> 🚀 \*\*Ejecución robusta contra Mail.*?mail-consolidado-v2\.applescript`\.$', motivo: 'doctrina para el modelo, no se muestra'}
  - {fichero: references/paso-1-proveedores.md, patron: '(?s)^> La plantilla `references/mail-consolidado\.applescript`.*?pierde la regla\.$', motivo: 'nota de documentación, no se muestra'}
  - {fichero: references/paso-1c-hilos.md, patron: '(?s)^HILO \[clave_hilo\]\n.*?verificacion: nativa \(Gmail\) / enviados \(iCloud\) / ninguna$', motivo: 'estructura interna del hilo, no se muestra'}

nuevas:           # claves sin literal original: origen «nuevo»; texto de referencia en español
  - {clave: entrada.afirmativo, texto: "sí, si, s, ok, vale, adelante"}
  - {clave: entrada.negativo, texto: "no, n, cancelar, detener"}
  - {clave: aviso.ia, texto: "Traducción generada por IA, sin revisión humana."}
  - {clave: aviso.idioma_desconocido, texto: "El idioma pedido no está disponible; se continúa en español. Idiomas disponibles:"}
  - {clave: aviso.respaldo, texto: "No se han podido cargar los catálogos de idioma; se continúa en español."}
