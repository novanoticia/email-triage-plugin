# OPCIONAL: copiar a la base de estado personal. No guardar credenciales aquí.
# Activar autoriza enviar extractos y perfil mínimo a OpenAI (API Decisions),
# con facturación independiente de Claude y de cualquier suscripción de ChatGPT.
# Se envía por correo: asunto, remitente y extracto sanitizados (≤1500 caracteres),
# perfil mínimo y una pregunta Choice por criterio activo. Nunca cuerpos crudos,
# adjuntos, hilos, pesos, carpetas ni controles. La clave va en OPENAI_API_KEY.
activo: false
acepta_envio_datos: false
modo: comparar                 # defecto sin movimientos; hibrido integra veredictos revisados
modelo: gpt-6-luna             # único modelo admitido por /v1/decisions (doc. 2026-10-25)
max_llamadas: 5                 # por invocación, una por correo/hilo, sin reintentos
timeout_segundos: 15
confianza_minima: 0.8           # experimental; no equivale a probabilidad de acierto
