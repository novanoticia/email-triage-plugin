# OPCIONAL: copiar a la base de estado personal. No guardar credenciales aquí.
# Activar autoriza enviar extractos y perfil mínimo a TypeSafe AI (otro proveedor).
activo: false
acepta_envio_datos: false
modo: comparar                 # defecto sin movimientos; hibrido integra veredictos revisados
# Sigue la versión estable actual. Puede fijarse un ID jev-X.Y.Z para reproducibilidad.
modelo: jev-latest              # alias estable; API oficial verificada 2026-10-16
max_llamadas: 5                 # 1–50, por invocación, una por correo/hilo, sin reintentos
timeout_segundos: 15
confianza_minima: 0.8           # experimental; no equivale a probabilidad de acierto
